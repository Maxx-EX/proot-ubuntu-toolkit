name: Build Ubuntu Toolkit

on:
  push: { branches: [ master, main ] }
  workflow_dispatch:

permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo docker system prune -af

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK / NDK (host)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch PRoot from Termux
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp
          BASE="https://packages.termux.dev/apt/termux-main"
          IDX="$BASE/dists/stable/main/binary-aarch64"
          
          if curl -fsSL "$IDX/Packages.gz" -o Packages.gz 2>/dev/null; then 
            gunzip -f Packages.gz
          else 
            curl -fsSL "$IDX/Packages" -o Packages
          fi
          
          PROOT_PATH=$(awk '/^Package: proot$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          TALLOC_PATH=$(awk '/^Package: libtalloc$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          
          curl -fLO "$BASE/$PROOT_PATH"
          curl -fLO "$BASE/$TALLOC_PATH"
          
          dpkg-deb -x proot_*.deb proot_extract
          dpkg-deb -x libtalloc_*.deb talloc_extract
          
          cp proot_extract/data/data/com.termux/files/usr/bin/proot "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"
          cp proot_extract/data/data/com.termux/files/usr/libexec/proot/loader "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot_loader.so"
          cp talloc_extract/data/data/com.termux/files/usr/lib/libtalloc.so.2 "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtalloc.so"
          chmod +x "$GITHUB_WORKSPACE"/app/src/main/jniLibs/arm64-v8a/*.so

      - name: Build Ubuntu rootfs with full APK toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static binfmt-support
          sudo rm -rf obb_input && sudo mkdir -p obb_input
          sudo debootstrap --arch=arm64 --foreign jammy obb_input http://ports.ubuntu.com/ubuntu-ports/
          sudo cp /usr/bin/qemu-aarch64-static obb_input/usr/bin/
          sudo chroot obb_input /debootstrap/debootstrap --second-stage
          
          sudo chroot obb_input bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              openjdk-17-jdk-headless unzip wget curl git ca-certificates \
              build-essential python3 python3-pip vim nano less tree
            apt-get clean && rm -rf /var/lib/apt/lists/*
            
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            mkdir -p /opt && unzip -q /tmp/gradle.zip -d /opt && rm /tmp/gradle.zip
            
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            mkdir -p /opt/android-sdk/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
            mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest && rm /tmp/cmdline-tools.zip
            
            export JAVA_OPTS="-Xmx2g" ANDROID_HOME=/opt/android-sdk ANDROID_SDK_ROOT=/opt/android-sdk
            export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin
            
            yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
            /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null
            
            wget -q https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -O /tmp/kotlin.zip
            unzip -q /tmp/kotlin.zip -d /opt && rm /tmp/kotlin.zip
            
            echo "export ANDROID_HOME=/opt/android-sdk" > /etc/profile.d/android.sh
            echo "export ANDROID_SDK_ROOT=/opt/android-sdk" >> /etc/profile.d/android.sh
            echo "export JAVA_OPTS=\"-Xmx2g\"" >> /etc/profile.d/android.sh
            echo "export PATH=\$PATH:/opt/gradle-8.7/bin:/opt/kotlinc/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools" >> /etc/profile.d/android.sh
            chmod +x /etc/profile.d/android.sh
            ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
            ln -sf /opt/kotlinc/bin/kotlinc /usr/local/bin/kotlinc

            # 安装 ai 命令行工具（OpenAI 兼容 API）
            cat > /usr/local/bin/ai << 'AIEOF'
#!/usr/bin/env python3
import os, sys, json, urllib.request, urllib.error

base = os.environ.get("OPENAI_BASE_URL", "https://api.openai.com/v1").rstrip("/")
key  = os.environ.get("OPENAI_API_KEY", "")
model = os.environ.get("OPENAI_MODEL", "gpt-4o-mini")

if not key:
    print("⚠️ 未设置 OPENAI_API_KEY，请先在 APP 设置页填入 API Key"); sys.exit(1)

prompt = " ".join(sys.argv[1:]) if len(sys.argv) > 1 else input("你: ")
if not prompt.strip():
    print("用法: ai 你的问题  或  ai"); sys.exit(0)

body = json.dumps({
    "model": model,
    "messages": [{"role": "user", "content": prompt}],
    "stream": False
}).encode()

req = urllib.request.Request(f"{base}/chat/completions", data=body, headers={
    "Content-Type": "application/json",
    "Authorization": f"Bearer {key}"
})
try:
    with urllib.request.urlopen(req, timeout=60) as r:
        data = json.loads(r.read())
    print(data["choices"][0]["message"]["content"])
except urllib.error.HTTPError as e:
    print(f"❌ HTTP {e.code}: {e.read().decode()[:500]}")
except Exception as e:
    print(f"❌ {e}")
AIEOF
            chmod +x /usr/local/bin/ai
          '
          
          sudo rm -rf obb_input/dev obb_input/proc obb_input/sys
          sudo du -sh obb_input

      - name: Package OBB
        run: |
          sudo tar -cf "main.1.com.maxx.ubuntutoolkit.obb" -C obb_input .
          sudo chown $(id -u):$(id -g) "main.1.com.maxx.ubuntutoolkit.obb"
          ls -lh *.obb

      - name: Build Debug APK
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuToolkit-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload OBB
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuToolkit-OBB
          path: main.1.com.maxx.ubuntutoolkit.obb
