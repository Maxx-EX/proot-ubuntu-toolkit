name: Build Ubuntu Toolkit

on:
  push: { branches: [ master, main ] }
  workflow_dispatch:

permissions: { contents: write }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { java-version: '17', distribution: 'temurin' }

      - uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK / NDK (host)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" "build-tools;34.0.0" \
            "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

      - name: Fetch PRoot from Termux (dynamic version)
        run: |
          set -e
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd /tmp

          BASE="https://packages.termux.dev/apt/termux-main"
          IDX="$BASE/dists/stable/main/binary-aarch64"

          # 下载并解压 Packages 索引（优先 gz，回退未压缩）
          if curl -fsSL "$IDX/Packages.gz" -o Packages.gz 2>/dev/null; then
            gunzip -f Packages.gz
          else
            curl -fsSL "$IDX/Packages" -o Packages
          fi

          # 动态解析 proot 的 Filename
          PROOT_PATH=$(awk '/^Package: proot$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          [ -z "$PROOT_PATH" ] && { echo "proot not found in index"; exit 1; }
          echo "proot path: $PROOT_PATH"
          curl -fLO "$BASE/$PROOT_PATH"

          # 动态解析 libtalloc 的 Filename
          TALLOC_PATH=$(awk '/^Package: libtalloc$/{f=1} f&&/^Filename:/{print $2; exit}' Packages)
          [ -z "$TALLOC_PATH" ] && { echo "libtalloc not found in index"; exit 1; }
          echo "libtalloc path: $TALLOC_PATH"
          curl -fLO "$BASE/$TALLOC_PATH"

          # 解压 deb
          dpkg-deb -x proot_*.deb proot_extract
          dpkg-deb -x libtalloc_*.deb talloc_extract

          # 拷入 jniLibs 并重命名为 lib*.so
          cp proot_extract/data/data/com.termux/files/usr/bin/proot \
             "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot.so"
          cp proot_extract/data/data/com.termux/files/usr/libexec/proot/loader \
             "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libproot_loader.so"
          cp talloc_extract/data/data/com.termux/files/usr/lib/libtalloc.so.2 \
             "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libtalloc.so"
          chmod +x "$GITHUB_WORKSPACE"/app/src/main/jniLibs/arm64-v8a/*.so
          ls -la "$GITHUB_WORKSPACE"/app/src/main/jniLibs/arm64-v8a/

      - name: Build Ubuntu rootfs with full APK toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq debootstrap qemu-user-static binfmt-support
          sudo rm -rf obb_input && sudo mkdir -p obb_input
          sudo debootstrap --arch=arm64 --foreign jammy obb_input http://ports.ubuntu.com/ubuntu-ports/
          sudo cp /usr/bin/qemu-aarch64-static obb_input/usr/bin/
          sudo chroot obb_input /debootstrap/debootstrap --second-stage

          sudo chroot obb_input bash -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends \
              openjdk-17-jdk-headless unzip wget curl git ca-certificates \
              build-essential python3 python3-pip vim nano less tree
            apt-get clean && rm -rf /var/lib/apt/lists/*

            # Gradle 8.7
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            mkdir -p /opt && unzip -q /tmp/gradle.zip -d /opt
            rm /tmp/gradle.zip

            # Android cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
            mkdir -p /opt/android-sdk/cmdline-tools
            unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
            mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
            rm /tmp/cmdline-tools.zip

            export JAVA_OPTS="-Xmx2g"
            export ANDROID_HOME=/opt/android-sdk
            export ANDROID_SDK_ROOT=/opt/android-sdk
            export PATH=$PATH:/opt/android-sdk/cmdline-tools/latest/bin

            yes | /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
            /opt/android-sdk/cmdline-tools/latest/bin/sdkmanager \
              "platform-tools" "platforms;android-34" "build-tools;34.0.0" \
              "ndk;26.3.11579264" "cmake;3.22.1" > /dev/null

            # Kotlin 1.9.24
            wget -q https://github.com/JetBrains/kotlin/releases/download/v1.9.24/kotlin-compiler-1.9.24.zip -O /tmp/kotlin.zip
            unzip -q /tmp/kotlin.zip -d /opt
            rm /tmp/kotlin.zip

            # 写入 profile
            cat > /etc/profile.d/android.sh <<PROFILE
export ANDROID_HOME=/opt/android-sdk
export ANDROID_SDK_ROOT=/opt/android-sdk
export JAVA_OPTS="-Xmx2g"
export PATH=\$PATH:/opt/gradle-8.7/bin:/opt/kotlinc/bin:/opt/android-sdk/cmdline-tools/latest/bin:/opt/android-sdk/platform-tools
PROFILE
            chmod +x /etc/profile.d/android.sh
            ln -sf /opt/gradle-8.7/bin/gradle /usr/local/bin/gradle
            ln -sf /opt/kotlinc/bin/kotlinc /usr/local/bin/kotlinc

            echo "=== Toolchain verify ==="
            java -version
            /opt/gradle-8.7/bin/gradle -v | head -5
            /opt/kotlinc/bin/kotlinc -version
            ls /opt/android-sdk/ndk/26.3.11579264/ | head
          '

          sudo du -sh obb_input

      - name: Package OBB
        run: |
          sudo chown -R $(id -u):$(id -g) obb_input
          zip -r -0 "main.1.com.maxx.ubuntutoolkit.obb" obb_input
          ls -lh *.obb

      - name: Build Release APK
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuToolkit-APK
          path: app/build/outputs/apk/release/app-release*.apk
          retention-days: 30

      - name: Upload OBB
        uses: actions/upload-artifact@v4
        with:
          name: UbuntuToolkit-OBB
          path: main.1.com.maxx.ubuntutoolkit.obb
          retention-days: 30